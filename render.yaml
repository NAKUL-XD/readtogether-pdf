services:
  - type: web
    name: readtogether-server
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install --production=false
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
